[project]
name = "py-noita-claude"
version = "0.2.1"
description = "A python game adaptation of Noita, written with claude."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pygame-ce>=2.5.0",
]

[project.scripts]
py-noita-claude = "src.main:main"
main = "src.main:main"
test = "pytest:main"
build = "src.build:main"
format = "src.tools:format_code"
lint = "src.tools:lint_code"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100