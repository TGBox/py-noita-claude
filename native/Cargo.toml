[package]
name = "cloita_core"
version = "0.1.0"
edition = "2021"
description = "Cell simulation core for Cloita (loaded from Python via ctypes)."
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
